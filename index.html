<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="NIGHTSHIFT: Survive the Midnight. A cinematic rain-soaked highway driving game that runs in your browser." />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <title>NIGHTSHIFT — Survive the Midnight</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070a'/%3E%3Cpath d='M8 23V9l16 14V9' fill='none' stroke='%23ffb14a' stroke-width='3.2' stroke-linecap='square'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      body { color: #e8ecf2; font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #ui { position: fixed; inset: 0; }
      #boot-error {
        position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); max-width: min(90vw, 640px);
        padding: 14px 18px; border: 1px solid rgba(255, 110, 90, .5); border-radius: 6px;
        background: rgba(20, 8, 8, .85); color: #ffb4a8; font-size: 14px; line-height: 1.45; z-index: 100;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1" aria-label="NIGHTSHIFT game view"></canvas>
    <div id="ui"></div>
    <div id="boot-error" role="alert" hidden></div>
    <noscript>NIGHTSHIFT needs JavaScript and WebGL 2 to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
